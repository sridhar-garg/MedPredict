name: Validate MedPredict UI
on:
  push:
    branches:
      - main
      - redesign/layout-v3-full-rebuild
  pull_request:
    branches:
      - main

jobs:
  syntax-and-ui-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python files without importing dependencies or secrets
        run: python -m compileall -q app.py login.py utils.py pages
      - name: Verify UI structural and appearance contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          pages = list(Path("pages").glob("*.py"))
          assert len(pages) >= 14, f"Expected 14 feature pages, got {len(pages)}"
          for page in pages:
              s = page.read_text(encoding="utf-8")
              ast.parse(s, filename=str(page))
              assert "page_intro(" in s, f"{page} missing new compact header"
              assert "apply_custom_css" in s or "apply_common_style" in s, str(page)

          for name in ("diabetes_app.py", "heart_app.py", "breast_app.py",
                       "profile.py", "history.py", "z_family.py"):
              src = (Path("pages") / name).read_text(encoding="utf-8")
              assert "st.tabs(" in src, f"{name} missing new task workflow"

          login = Path("login.py").read_text(encoding="utf-8")
          app = Path("app.py").read_text(encoding="utf-8")
          utils = Path("utils.py").read_text(encoding="utf-8")
          css = Path("design_system.css").read_text(encoding="utf-8")
          assert "mp-auth-intro" in login and "mp-auth-card-head" in login
          assert "mp-login-visual" not in login and "<svg" not in login
          for auth in ("authenticate_user(", "send_email_otp(", "create_account(", "set_user_credentials("):
              assert auth in login, auth
          assert "st.tabs(" in app and "mp-dashboard-breadcrumb" in app
          assert "healthai-hero" not in app
          assert "mp_light_switch" in login and "mp_light_switch" in utils
          assert 'healthai_theme", "dark"' in utils
          assert "healthai-theme-light-marker" in css
          assert "button[kind=\"primary\"] *" in css
          assert "button:not([kind=\"primary\"]) *" in css

          def luminance(color):
              values = [int(color[n:n+2], 16) / 255 for n in (1, 3, 5)]
              linear = [v / 12.92 if v <= 0.04045 else ((v + 0.055) / 1.055)**2.4
                        for v in values]
              return .2126 * linear[0] + .7152 * linear[1] + .0722 * linear[2]

          def contrast(a, b):
              hi, lo = sorted((luminance(a), luminance(b)), reverse=True)
              return (hi + .05) / (lo + .05)

          assert contrast("#64e0d0", "#06272a") >= 4.5, "Dark mode CTA contrast"
          assert contrast("#087a73", "#ffffff") >= 4.5, "Light mode CTA contrast"
          assert contrast("#1b3142", "#eef9fc") >= 4.5, "Dark secondary contrast"
          assert contrast("#e9f2f5", "#163a4b") >= 4.5, "Light secondary contrast"
          print(f"Validated {len(pages)} pages, 6 workflows and theme-aware button colors")
          PY
