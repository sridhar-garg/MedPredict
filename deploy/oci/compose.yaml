name: medpredict
services:
  app:
    build:
      context: ../..
    env_file:
      - /etc/medpredict/app.env
    environment:
      APP_BASE_URL: https://${MEDPREDICT_PUBLIC_HOST:?Set the public DNS hostname}
      PORT: "7860"
    expose:
      - "7860"
    volumes:
      - medpredict-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:7860/_stcore/health', timeout=3); assert r.status == 200"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
  https:
    image: caddy:2-alpine
    environment:
      MEDPREDICT_PUBLIC_HOST: ${MEDPREDICT_PUBLIC_HOST:?Set the public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - https-certs:/data
      - https-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  medpredict-data:
  https-certs:
  https-config:
